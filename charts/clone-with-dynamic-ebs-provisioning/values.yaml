replicaCount: 1

# Database type: "postgres" or "mysql"
dbType: postgres

image:
  repository: "<your-image-repository>"
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  # Default port: 5432 for postgres, 3306 for mysql (auto-selected if not specified)
  # port: 5432

# Shared memory size for database operations
shmSize: 128Mi

env:
  - name: PASSWORD
    value: "<your-password>"
  - name: U
    value: "<your-U-value>"
  - name: UUID
    value: ""
  - name: BACKUP_SCHEDULE
    value: "0 0 * * *"
  - name: BACKUP_DIR
    value: "/dubhub/backups"
  - name: MAX_BACKUPS
    value: 1
  - name: SPACE_USAGE_MIN_PERCENT
    value: 10


imagePullSecrets:
  - name: "<your-secret-name>"

storage:
  size: "100Gi"
  storageClassName: "ebs-sc-dubhub" # matches the storage class name under configs/storage-class.yaml, if an existing storage class is used instead update this to reflect the class name

# Temporary mechanism to patch binaries in /dubhub/bin/ from files staged on the PVC.
# Place the replacement files at <PVC root>/<pvcSubPath>/<filename> and they will be
# copied into /dubhub/bin/ on every pod start (durable across restarts).
# Disable once a new image containing the fix is released.
binPatch:
  enabled: false
  pvcSubPath: "patch"
  files:
    - launcher
    - libgenie.so
    - lds