apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dubhub-clone-chart.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "dubhub-clone-chart.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "dubhub-clone-chart.name" . }}
    spec:
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ .name }}
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ include "dubhub-clone-chart.dbPort" . }}
          env:
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          volumeMounts:
          - name: sql-scripts
            mountPath: /docker-entrypoint-initdb.d
          - name: dshm
            mountPath: /dev/shm
          lifecycle:
            postStart:
              exec:
                command: ["sh", "-c", "timeout 300 sh -c '{{ include "dubhub-clone-chart.readinessCommand" . }}; {{ include "dubhub-clone-chart.initCommand" . }}'"]
      volumes:
        - name: sql-scripts
          configMap:
            name: {{ include "dubhub-clone-chart.fullname" . }}-sql-scripts
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shmSize }}