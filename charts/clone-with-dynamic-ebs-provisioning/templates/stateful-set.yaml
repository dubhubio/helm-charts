apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dubhub-clone-chart.fullname" . }}
spec:
  serviceName: {{ include "dubhub-clone-chart.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "dubhub-clone-chart.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "dubhub-clone-chart.name" . }}
    spec:
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ .name }}
        {{- end }}
      initContainers:
      - name: volume-permissions
        image: busybox
        command: ['sh', '-c', 'chown -R 102:104 /var/lds/clones && chmod -R 770 /var/lds/clones']
        volumeMounts:
        - name: data
          mountPath: /var/lds/clones
      {{- if .Values.binPatch.enabled }}
      - name: bin-patch
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          runAsUser: 0
        command:
        - sh
        - -c
        - |
          set -eu
          # Seed the shared bin dir with the image's original /dubhub/bin contents.
          # Use tar so we preserve modes/symlinks without trying to chown/chtime
          # the destination mount root (which fails for non-root users).
          # Run as root so tar can preserve the original UIDs/GIDs and modes from
          # /dubhub/bin (otherwise the main container's user can't exec its own bins).
          tar -C /dubhub/bin -cf - . | tar -C /mnt/dubhub-bin -xpf -
          # Overlay any patch files staged on the PVC
          if [ -d /patch ]; then
            for f in {{ .Values.binPatch.files | join " " }}; do
              if [ -f "/patch/$f" ]; then
                echo "Applying patch: $f"
                cp -f "/patch/$f" "/mnt/dubhub-bin/$f"
                # Match owner/mode of the image's original file so the main
                # container's user can read/exec it.
                if [ -e "/dubhub/bin/$f" ]; then
                  chown --reference="/dubhub/bin/$f" "/mnt/dubhub-bin/$f"
                  chmod --reference="/dubhub/bin/$f" "/mnt/dubhub-bin/$f"
                else
                  chmod 0755 "/mnt/dubhub-bin/$f"
                fi
              fi
            done
          fi
        volumeMounts:
        - name: dubhub-bin
          mountPath: /mnt/dubhub-bin
        - name: data
          mountPath: /patch
          subPath: {{ .Values.binPatch.pvcSubPath }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ include "dubhub-clone-chart.dbPort" . }}
        env:
          {{- range .Values.env }}
          - name: {{ .name }}
            value: {{ .value | quote }}
          {{- end }}
        volumeMounts:
        - name: data
          mountPath: /var/lds/clones
        - name: sql-scripts
          mountPath: /docker-entrypoint-initdb.d
        - name: dshm
          mountPath: /dev/shm
        {{- if .Values.binPatch.enabled }}
        - name: dubhub-bin
          mountPath: /dubhub/bin
        {{- end }}
        lifecycle:
          postStart:
            exec:
              command: ["sh", "-c", "timeout 300 sh -c '{{ include "dubhub-clone-chart.readinessCommand" . }}; {{ include "dubhub-clone-chart.initCommand" . }}'"]
      volumes:
        - name: sql-scripts
          configMap:
            name: {{ include "dubhub-clone-chart.fullname" . }}-sql-scripts
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shmSize }}
        {{- if .Values.binPatch.enabled }}
        - name: dubhub-bin
          emptyDir: {}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: "{{ .Values.storage.size }}"
        storageClassName: "{{ .Values.storage.storageClassName }}"