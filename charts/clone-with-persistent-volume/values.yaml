replicaCount: 1

# Database type: "postgres" or "mysql"
dbType: postgres

image:
  repository: "<your-image-repository>"
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  # Default port: 5432 for postgres, 3306 for mysql (auto-selected if not specified)
  # port: 5432

# Shared memory size for database operations
shmSize: 128Mi

env:
  - name: PASSWORD
    value: "<your-password>"
  - name: U
    value: "<your-U-value>"
  - name: UUID
    value: ""

imagePullSecrets:
  - name: "<your-secret-name>"

persistentVolume:
  name: "dubhub-pvc"
  size: 100Gi
  # Set to true to create a chart-managed PV/PVC bound to an AWS EBS volume.
  # Leave false on minikube / dynamic-provisioning clusters; the StatefulSet's
  # volumeClaimTemplate will use storageClassName below.
  create: false
  # storageClassName for the StatefulSet's volumeClaimTemplate.
  # Leave empty ("") to use the cluster default. On minikube use "standard".
  storageClassName: ""
  awsElasticBlockStore:
    volumeID: "<your-volume-id>"
    fsType: "<fstype>"

# Temporary mechanism to patch binaries in /dubhub/bin/ from files staged on the PVC.
# Place the replacement files at <PVC root>/<pvcSubPath>/<filename> and they will be
# copied into /dubhub/bin/ on every pod start (durable across restarts).
# Disable once a new image containing the fix is released.
binPatch:
  enabled: false
  pvcSubPath: "patch"
  files:
    - launcher
    - libgenie.so
    - lds